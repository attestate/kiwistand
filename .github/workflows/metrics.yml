name: Crawl check

# Weekly check that crawlers and link-preview bots get the public pages.
# Prints only status codes and robots headers, so it's fine in public logs.
# The traffic report (Search Console, Cloudflare) runs in the private
# attestate/kiwistand-metrics repo: this repo is public, and so are its logs.
on:
  schedule:
    - cron: "17 5 * * 1"
  push:
    paths:
      - scripts/crawl-check.mjs
      - .github/workflows/metrics.yml
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: node scripts/crawl-check.mjs | tee crawl-check.md
      - run: cat crawl-check.md >> "$GITHUB_STEP_SUMMARY"
