name: Metrics report

# Weekly traffic report from Cloudflare and Google Search Console (no Claude
# connector for either). Printed to the job log; see scripts/metrics-report.mjs
# for the credentials it needs. Sources without credentials are skipped.
on:
  schedule:
    - cron: "17 5 * * 1"
  push:
    paths:
      - scripts/metrics-report.mjs
      - .github/workflows/metrics.yml
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: node scripts/metrics-report.mjs | tee metrics-report.md
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
      - run: cat metrics-report.md >> "$GITHUB_STEP_SUMMARY"
