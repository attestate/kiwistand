name: Cloudflare rules

# Lets the RSS feed, sitemaps, robots.txt, llms.txt and farcaster.json skip
# Super Bot Fight Mode, so feed readers aren't challenged. See
# scripts/cloudflare-rules.mjs. Run it by hand: Actions → Cloudflare rules →
# Run workflow. Without "apply" it only prints a summary and the change.
#
# Needs the repository secret CLOUDFLARE_WAF_TOKEN (Zone → Zone WAF → Edit,
# optionally Zone → Bot Management → Read) and the variable CLOUDFLARE_ZONE_ID.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the change (otherwise dry run)"
        type: boolean
        default: false

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: node scripts/cloudflare-rules.mjs ${{ inputs.apply && '--apply' || '' }}
        env:
          CLOUDFLARE_WAF_TOKEN: ${{ secrets.CLOUDFLARE_WAF_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
      # What crawlers and preview bots get afterwards (from a datacenter IP).
      - if: inputs.apply
        run: sleep 30 && node scripts/crawl-check.mjs
