name: Preview audit

# Measures link previews against the stories news.kiwistand.com serves:
# main's parser (base) vs. this branch's parser (after), both fetching from
# this runner, with production's stored preview for reference. The report is
# printed to the log and kept as an artifact.
on:
  push:
    paths:
      - src/parser.mjs
      - scripts/preview-*.mjs
      - .github/workflows/preview-audit.yml
  workflow_dispatch:

# A newer push makes the running audit moot.
concurrency:
  group: preview-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CACHE_DIR: test-cache
      DATA_DIR: test-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm ci
      - run: mkdir -p test-cache test-data
      - name: Check out main as the base parser
        run: |
          git fetch --depth=1 origin main
          git worktree add ../base FETCH_HEAD
          ln -s "$PWD/node_modules" ../base/node_modules
      - run: node scripts/preview-audit-http.mjs --pages 10 --baseline ../base --out preview-audit
      # Raw tags and parser log for a sample of links that are still bad, to
      # find the cause rather than guess it. Edit the list as the audit moves.
      - name: Debug sample of bad previews
        continue-on-error: true
        run: >
          timeout 600 node scripts/preview-debug.mjs
          https://vitalik.eth.limo/general/2026/04/02/secure_llms.html
          https://blog.ethereum.org/2025/07/10/future-of-ecodev
          https://ethereum.org/en/whitepaper
          https://www.reuters.com/investigates/special-report/global-art-banksy
          https://www.forbes.com/sites/digital-assets/article/what-is-layer-2
          https://www.dlnews.com/articles/deals/ripple-eyeing-acquisitions-and-xrp-upgrades-similar-to-ethereum
          https://paragraph.com/@blog/your-work-paid-for-by-agents
          https://telegra.ph/Farcasters-Locust-Plague-02-14
          https://a16zcrypto.com/posts/article/end-foundation-era-crypto
          https://geohot.github.io/blog/jekyll/update/2026/05/24/the-eternal-sloptember.html
          https://dune.com/rvolz/kiwi-news
          2>&1 | cut -c1-400
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-audit
          path: preview-audit.*
