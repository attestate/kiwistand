name: Preview audit

# Measures link previews against the stories news.kiwistand.com serves:
# production's preview (before) vs. this branch's parser (after). The report
# is printed to the log and kept as an artifact.
on:
  push:
    paths:
      - src/parser.mjs
      - scripts/preview-*.mjs
      - .github/workflows/preview-audit.yml
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CACHE_DIR: test-cache
      DATA_DIR: test-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm ci
      - run: mkdir -p test-cache test-data
      - run: node scripts/preview-audit-http.mjs --pages 10 --out preview-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-audit
          path: preview-audit.*
